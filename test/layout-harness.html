<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bilibili Downloader Layout Harness</title>
  <link rel="stylesheet" href="../content/content.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #ececec; }
    #bili-dl-panel { right: 16px; bottom: 16px; }
    #bili-dl-menu { right: 0; }
    .fixture-block { flex: 0 0 auto; }
    #layout-result { position: fixed; inset: 8px auto auto 8px; width: 430px; margin: 0; padding: 8px; box-sizing: border-box; white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; color: #111; font: 12px/1.45 Consolas, monospace; }
  </style>
</head>
<body>
  <div id="bili-dl-panel">
    <div id="bili-dl-panel-root">
      <button id="bili-dl-toggle">悬浮按钮</button>
      <div id="bili-dl-menu" class="is-list-page">
        <div class="bili-dl-header">
          <div class="bili-dl-header-left"><strong>下载助手 B站</strong><span class="bili-dl-version">v1.0.5</span></div>
          <button id="bili-dl-close">×</button>
        </div>
        <div id="bili-dl-home">
          <div class="bili-dl-mode-tabs">
            <button data-mode="video">单视频</button><button data-mode="list">列表下载</button>
          </div>
          <div id="bili-dl-video-body" class="bili-dl-body hidden">
            <div class="bili-dl-video-card fixture-block"><div class="bili-dl-video-meta"><strong>成熟产品布局回归测试视频</strong><div class="bili-dl-video-sub">13万 播放 · 8天前</div></div></div>
            <div class="bili-dl-section fixture-block"><div class="bili-dl-section-head">清晰度</div><div class="bili-dl-quality-pills"><button class="bili-dl-pill active">1080P 高清</button><button class="bili-dl-pill">720P 准高清</button><button class="bili-dl-pill">480P 标清</button><button class="bili-dl-pill">360P 流畅</button></div></div>
            <div class="bili-dl-format-row fixture-block"><span class="bili-dl-info-item">格式</span><div class="bili-dl-format-pills"><button class="bili-dl-pill active">MP4 视频</button><button class="bili-dl-pill">M4A 音频</button></div></div>
            <div class="bili-dl-estimate fixture-block"><span>预计大小：约 165.7 MB（约数，仅供参考）</span></div>
            <button class="bili-dl-btn fixture-block">再下一个 (1)</button>
            <button class="bili-dl-btn bili-dl-btn-secondary fixture-block">下载封面</button>
            <div class="bili-dl-job-list fixture-block">
              <div class="bili-dl-progress bili-dl-job-card"><div class="bili-dl-progress-meta"><span class="bili-dl-progress-title">当前下载任务</span><span class="bili-dl-progress-q">1080P</span></div><div class="bili-dl-progress-head"><span>正在下载</span><span>45%</span></div><div class="bili-dl-progress-track"><div class="bili-dl-progress-bar" style="width:45%"></div></div><div class="bili-dl-progress-actions"><button class="bili-dl-action-btn">暂停</button><button class="bili-dl-action-btn danger">取消</button></div></div>
            </div>
          </div>
          <div id="bili-dl-list-body" class="bili-dl-list-body hidden">
            <div class="bili-dl-section"><div class="bili-dl-section-head">清晰度</div><div id="bili-dl-list-quality-pills" class="bili-dl-quality-pills"><button class="bili-dl-pill active">1080P 高清</button><button class="bili-dl-pill">720P 准高清</button><button class="bili-dl-pill">480P 标清</button><button class="bili-dl-pill">360P 流畅</button></div></div>
            <div class="bili-dl-list-tools"><input type="search" placeholder="搜索已加载视频标题"><div class="bili-dl-list-filter"><button class="active">全部</button><button>已选</button></div></div>
            <div class="bili-dl-list-head"><strong>视频列表</strong><span>已加载 24 / 共 4139 个　刷新</span></div>
            <div class="bili-dl-list-items" id="fixture-list"></div>
            <button id="bili-dl-list-load-more" class="bili-dl-btn bili-dl-btn-secondary">继续加载（已加载 24 个）</button>
            <button id="bili-dl-list-start" class="bili-dl-btn">下载已选 3 个视频</button>
            <button id="bili-dl-list-queue-cancel" class="bili-dl-btn bili-dl-btn-secondary">取消整队</button>
            <div id="bili-dl-list-job-list" class="bili-dl-job-list"><div class="bili-dl-progress bili-dl-job-card"><div class="bili-dl-progress-meta"><span class="bili-dl-progress-title">列表下载任务</span><span class="bili-dl-progress-q">1080P</span></div><div class="bili-dl-progress-head"><span>正在下载</span><span>32%</span></div><div class="bili-dl-progress-track"><div class="bili-dl-progress-bar" style="width:32%"></div></div><div class="bili-dl-progress-actions"><button class="bili-dl-action-btn">暂停</button><button class="bili-dl-action-btn danger">取消</button></div></div></div>
            <button id="bili-dl-list-retry-failed" class="bili-dl-btn bili-dl-btn-secondary">重试失败视频（1）</button>
            <p class="bili-dl-list-status">正在下载 1/3：列表下载任务</p>
          </div>
          <div class="bili-dl-footer"><div class="bili-dl-footer-links"><button class="bili-dl-faq-link">常见问题</button><button class="bili-dl-faq-link">隐私政策</button><button class="bili-dl-faq-link">公告</button><button class="bili-dl-faq-link">开发合作</button><span class="bili-dl-feedback">反馈邮箱：hangdudu0@agent.qq.com</span></div></div>
        </div>
      </div>
    </div>
  </div>
  <pre id="layout-result"></pre>
  <script>
    const mode = location.hash.slice(1) || 'video-job';
    const video = document.querySelector('#bili-dl-video-body');
    const list = document.querySelector('#bili-dl-list-body');
    const tabs = [...document.querySelectorAll('[data-mode]')];
    const listItems = document.querySelector('#fixture-list');
    for (let i = 1; i <= 24; i++) {
      const row = document.createElement('label');
      row.className = 'bili-dl-list-item';
      row.innerHTML = `<input type="checkbox"><span class="bili-dl-list-item-index">${i}</span><span class="bili-dl-list-item-meta"><strong>第 ${i} 个列表视频标题</strong><small>8.3万播放 · 5:48</small></span>`;
      listItems.append(row);
    }
    const isList = mode.startsWith('list');
    video.classList.toggle('hidden', isList);
    list.classList.toggle('hidden', !isList);
    tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.mode === (isList ? 'list' : 'video')));
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const menu = document.querySelector('#bili-dl-menu');
      const home = document.querySelector('#bili-dl-home');
      const active = isList ? list : video;
      const footer = document.querySelector('.bili-dl-footer');
      const toggle = document.querySelector('#bili-dl-toggle');
      const jobList = active.querySelector('.bili-dl-job-list');
      if (isList) {
        jobList.scrollTop = jobList.scrollHeight;
        active.scrollTop = active.scrollHeight;
      } else active.scrollTop = active.scrollHeight;
      const jobCard = jobList.querySelector('.bili-dl-job-card');
      const result = {
        mode,
        menuHeight: menu.clientHeight,
        homeOverflow: getComputedStyle(home).overflowY,
        activeOverflow: getComputedStyle(active).overflowY,
        activeClientHeight: active.clientHeight,
        activeScrollHeight: active.scrollHeight,
        activeCanScroll: active.scrollHeight > active.clientHeight,
        listClientHeight: isList ? listItems.clientHeight : null,
        listScrollHeight: isList ? listItems.scrollHeight : null,
        listCanScroll: isList ? listItems.scrollHeight > listItems.clientHeight : null,
        jobVisible: jobCard.getBoundingClientRect().bottom <= footer.getBoundingClientRect().top + 1,
        footerInsideMenu: footer.getBoundingClientRect().bottom <= menu.getBoundingClientRect().bottom + 1,
        toggleVisible: getComputedStyle(toggle).visibility === 'visible' && getComputedStyle(toggle).pointerEvents !== 'none',
        menuDoesNotOverlapToggle: menu.getBoundingClientRect().bottom <= toggle.getBoundingClientRect().top
      };
      document.querySelector('#layout-result').textContent = JSON.stringify(result);
      document.title = result.footerInsideMenu && result.jobVisible && result.toggleVisible && result.menuDoesNotOverlapToggle && (isList ? result.listCanScroll : result.activeCanScroll) ? 'PASS' : 'FAIL';
    }));
  </script>
</body>
</html>
